let questions = [];
let currentQuestion = 0;
let score = 0;
let timeLeft = TOTAL_TIME;
let timer = null;
let answered = false;

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function randomizeOptions(question) {
  const optionObjects = question.options.map((text, index) => {
    return {
      text: text,
      isCorrect: index === question.answer
    };
  });

  const shuffledOptions = shuffle(optionObjects);

  return {
    ...question,
    options: shuffledOptions.map(item => item.text),
    answer: shuffledOptions.findIndex(item => item.isCorrect)
  };
}

function getQuestionGroup(question) {
  const category = question.category || "";

  if (
    category.includes("職場") ||
    category.includes("交通") ||
    category.includes("租屋") ||
    category.includes("網路")
  ) {
    return "life";
  }

  if (
    category.includes("警察") ||
    category.includes("刑事") ||
    category.includes("消費")
  ) {
    return "twist";
  }

  if (
    category.includes("公務員") ||
    category.includes("國考") ||
    category.includes("行政法")
  ) {
    return "exam";
  }

  return "life";
}

function getQuestionDifficulty(question) {
  if (question.difficulty) {
    return question.difficulty;
  }

  const text = [
    question.category || "",
    question.question || "",
    question.trap || "",
    question.explain || ""
  ].join("");

  if (
    text.includes("信賴保護") ||
    text.includes("法律保留") ||
    text.includes("徵收") ||
    text.includes("公務員下班後") ||
    text.includes("開公司") ||
    text.includes("違法命令") ||
    text.includes("搜索票") ||
    text.includes("和解書")
  ) {
    return "Hard";
  }

  if (
    text.includes("警察") ||
    text.includes("手機") ||
    text.includes("車禍") ||
    text.includes("押金") ||
    text.includes("冷氣") ||
    text.includes("七天鑑賞") ||
    text.includes("瑕疵") ||
    text.includes("標錯價") ||
    text.includes("錄音")
  ) {
    return "Normal";
  }

  return "Easy";
}

function pickQuestionsByRule(bank, rule, usedQuestions) {
  const candidates = shuffle(bank).filter(question => {
    const group = getQuestionGroup(question);
    const difficulty = getQuestionDifficulty(question);

    return (
      group === rule.group &&
      rule.difficulties.includes(difficulty) &&
      !usedQuestions.has(question)
    );
  });

  return candidates.slice(0, rule.count);
}

function buildFiveQuestionSet(bank) {
  const selected = [];
  const usedQuestions = new Set();

  const rules = [
    {
      group: "life",
      difficulties: ["Easy"],
      count: 1
    },
    {
      group: "life",
      difficulties: ["Normal", "Easy"],
      count: 1
    },
    {
      group: "twist",
      difficulties: ["Easy", "Normal"],
      count: 1
    },
    {
      group: "twist",
      difficulties: ["Normal", "Hard"],
      count: 1
    },
    {
      group: "exam",
      difficulties: ["Normal", "Hard"],
      count: 1
    }
  ];

  rules.forEach(rule => {
    const picked = pickQuestionsByRule(bank, rule, usedQuestions);

    picked.forEach(question => {
      selected.push(question);
      usedQuestions.add(question);
    });
  });

  if (selected.length < QUESTION_COUNT) {
    const fallback = shuffle(bank).filter(question => !usedQuestions.has(question));

    fallback.forEach(question => {
      if (selected.length < QUESTION_COUNT) {
        selected.push(question);
        usedQuestions.add(question);
      }
    });
  }

  return selected.slice(0, QUESTION_COUNT).map(randomizeOptions);
}

async function initLiff() {
  try {
    if (typeof liff === "undefined") {
      console.log("LIFF SDK 尚未載入，使用訪客模式");
      return;
    }

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();

    lineUser = {
      userId: profile.userId || "",
      displayName: profile.displayName || "LINE 使用者",
      pictureUrl: profile.pictureUrl || ""
    };

    console.log("LINE 使用者資料：", lineUser);

  } catch (error) {
    console.log("LIFF 初始化失敗：", error);
  }
}

function startTimer() {

  clearInterval(timer);

  document.getElementById("time").textContent = timeLeft;

  timer = setInterval(() => {

    timeLeft--;

    document.getElementById("time").textContent = timeLeft;

    if(timeLeft <= 0){
      showResult();
    }

  },1000);

}

function renderQuestion(){

  answered = false;

  const q = questions[currentQuestion];

  document.getElementById("progress").textContent =
    `第 ${currentQuestion + 1} / ${questions.length} 題`;

  document.getElementById("category").textContent = q.category;

  document.getElementById("question").textContent = q.question;

  document.getElementById("nextBtn").classList.add("hidden");

  const feedback = document.getElementById("feedback");

  feedback.className = "feedback";

  feedback.textContent = "";

  const optionsBox = document.getElementById("options");

  optionsBox.innerHTML = "";

  q.options.forEach((option,index)=>{

    const btn = document.createElement("button");

    btn.className = "option";

    btn.textContent = `${index + 1}. ${option}`;

    btn.onclick = ()=> selectAnswer(index,btn);

    optionsBox.appendChild(btn);

  });

}

function selectAnswer(index,btn){

  if(answered) return;

  answered = true;

  const q = questions[currentQuestion];

answerLogs.push({
  question: q.question,
  selectedText: q.options[index],
  correctText: q.options[q.answer],
  isCorrect: index === q.answer,
  category: q.category
});

const allButtons = document.querySelectorAll(".option");

  allButtons.forEach((button,i)=>{

    button.disabled = true;

    if(i === q.answer){
      button.classList.add("correct");
    }

  });

  const feedback = document.getElementById("feedback");

  if(index === q.answer){

    score++;

    feedback.className = "feedback show correct-box";

    feedback.innerHTML =
      `<strong>你避開了：${q.trap}</strong><br><br>${q.explain}`;

  }else{

    btn.classList.add("wrong");

    feedback.className = "feedback show wrong-box";

    feedback.innerHTML =
      `<strong>你踩到了：${q.trap}</strong><br><br>${q.explain}`;

  }

  if(currentQuestion < questions.length - 1){

    document.getElementById("nextBtn").classList.remove("hidden");

  }else{

    setTimeout(showResult,1000);

  }

}

function nextQuestion(){

  currentQuestion++;

  renderQuestion();

}

function showResult(){

  clearInterval(timer);

  document.getElementById("quizScreen").classList.add("hidden");

  document.getElementById("resultScreen").classList.remove("hidden");

  document.getElementById("resultScore").textContent =
    `答對 ${score} / ${questions.length} 題`;

  let emoji = "🫠";
  let title = "高危險韭菜體質";
  let text = "看到『只是幫忙』『大家都這樣』時，請先停三秒。";

    title = "台灣防坑大師";
    text = "你對台灣社會陷阱非常敏感，很多話術騙不到你。";

  }else if(score >= 3){

    emoji = "🦊";
    title = "半熟防坑玩家";
    text = "你有基本警覺，但偶爾還是可能被人情或話術影響。";

  document.getElementById("resultTitle").textContent = title;

}

function sendResultToSheet(resultTitle, resultText) {
  if (resultSent) return;

const payload = {
  eventType: "result",
  sessionId: sessionId,
  activityName: "台灣人生存測驗",
  userName: lineUser.displayName,
  userId: lineUser.userId,
  score: score,
  total: questions.length,
  resultTitle: resultTitle,
  resultText: resultText,
  clickedLead: false,
  source: "LIFF",
  userAgent: navigator.userAgent,
  answers: answerLogs
};

  console.log("準備送出資料：", payload);

  const data = JSON.stringify(payload);

  function sendByFetch() {
    return fetch(GAS_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: data
    });
  }

  if (navigator.sendBeacon) {
    const blob = new Blob([data], {
      type: "text/plain;charset=utf-8"
    });

    const beaconSuccess = navigator.sendBeacon(GAS_WEB_APP_URL, blob);

    if (beaconSuccess) {
      resultSent = true;
      return;
    }
  }

  sendByFetch()
    .then(function() {
      resultSent = true;
    })
    .catch(function(error) {
      console.log("資料送出失敗：", error);
    });
}
